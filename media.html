    <h2>Embedding Music Files</h2>
    <hr />
    <audio src="music/HappyDespicableme.mp3" controls></audio>
    <audio controls>
        <source src="music/FreedomDespicableme.mp3" type="audio/mpeg" />
        <source src="music/HappyDespicableme.mp3" type="audio/mpeg" />
    </audio>
    <h3>Embedding Video Files</h3>
    <video controls src="video/maryann.mp4" width="250px" height="250px">
    </video>
    <video controls width="250px" height="250px" poster="img/Myheroacademia.jpg">
        <source src="video/little.mp4" type="video/mp4" />
        <source src="video/VID-20260515-WA0038.mp4" type="video/mp4" />
        <source src="video/VID-20260515-WA0021.mp4" type="video/mp4" />
    </video>
    <h3>Embedding Other Document (pdf)</h3>
    <iframe src="docs/1992constitution.pdf" frameborder="8" width="700px" height="500px"></iframe>
