<!DOCTYPE html>
<html>

<head>
    <title>Working with Images</title>
</head>

<body>
    <h2>Embedding Image Files on Web Pages</h2>
    <hr />
    <h3>Using the Generic <i>img</i> tag</h3>
    <img src="img/demonslayer.jpg" alt="An image of a Man" width="300px" height="250px" />
    <img src="img/stranger.jpg" alt="An image of People" width="300px" height="250px" />
    <img src="img/Myheroacademia.jpg" alt="An image of a Anime characters" width="300px" height="250px" />
    <h3>Usiing HTML 5 <i>figure</i> tag</h3>
    <figure>
        <img src="img/demonslayer.jpg" alt="An image of a Man" width="300px" height="250px" />
        <figcaption>Fig. 1.1: A Man</figcaption>
    </figure>
    <figure>
        <img src="img/stranger.jpg" alt="An image of People" width="300px" height="250px" />
        <figcaption>Fig. 1.2: People</figcaption>
    </figure>
    <figure>
        <img src="img/Myheroacademia.jpg" alt="An image of a Anime characters" width="300px" height="250px" />
        <figcaption>Fig. 1.3: Anime characters</figcaption>
    </figure>
